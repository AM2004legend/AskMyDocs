services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: askmydocs
      POSTGRES_PASSWORD: askmydocs
      POSTGRES_DB: askmydocs
    ports:
      - "5433:5432"   # 5433 on your PC so it never clashes with a locally installed Postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U askmydocs"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
